###############################################################################
# dnscrypt-proxy configuration — SnapDeploy DoH deployment                    #
#                                                                             #
# Trimmed from upstream's ~1000-line example-config.toml down to just the    #
# settings this deployment actually uses, with brief comments. Full option   #
# docs: https://github.com/DNSCrypt/dnscrypt-proxy/wiki                      #
#                                                                             #
# server_names / [static.*] below are NOT runtime-overridable (see start.sh).#
# This deployment is deliberately self-contained: three pinned HaGeZi DoH    #
# stamps, no remote resolver source, no dynamic resolver selection.          #
###############################################################################

server_names = ['HaGeZiDNS1', 'HaGeZiDNS2', 'HaGeZiDNS3']

## listen_addresses is rewritten at container start from $DNS_LISTEN (start.sh).
listen_addresses = ['127.0.0.1:5300']

## Maximum simultaneous client connections. Kept low for the 0.25 vCPU / 512MB budget.
max_clients = 64

# user_name = 'nobody'  # not used: privilege drop is handled by start.sh/su-exec


###############################################################################
#                            Server Selection                                 #
###############################################################################

ipv4_servers = true
ipv6_servers = false          # no IPv6 egress assumed on the hosting platform
dnscrypt_servers = false      # DNSCrypt protocol resolvers disabled
doh_servers = true            # DoH resolvers only (matches the static stamps below)
odoh_servers = false

require_dnssec = false
require_nolog = true          # irrelevant here: only applies to remote-source selection
require_nofilter = true       # (no remote source is configured; static servers bypass these)
disabled_server_names = []


###############################################################################
#                           Connection Settings                               #
###############################################################################

force_tcp = false
http3 = false
http3_probe = false

# proxy = 'socks5://dnscrypt:dnscrypt@127.0.0.1:9050'  # route via Tor (unused)
# http_proxy = 'http://127.0.0.1:8888'                 # HTTP/HTTPS proxy for DoH (unused)

## Per-query timeout, in milliseconds.
timeout = 5000

## Keepalive for HTTP(S)/DoH connections, in seconds.
keepalive = 10

# edns_client_subnet = ['0.0.0.0/0', '2001:db8::/32']
# blocked_query_response = 'refused'  # default is 'hinfo'


###############################################################################
#                        Load Balancing & Performance                         #
###############################################################################

## 'p2': randomly choose 1 of the 2 fastest servers. Cheaper to compute than the
## default 'wp2' with only 3 static servers, and avoids favoring one server
## into a hot path under limited CPU.
lb_strategy = 'p2'
lb_estimator = true

# timeout_load_reduction = 0.75   # dynamic timeout shrink near max_clients
# enable_hot_reload = false       # extra CPU/memory to watch config files; not needed


###############################################################################
#                                Logging                                      #
###############################################################################

# log_level = 2
# log_file = 'dnscrypt-proxy.log'   # logs go to stdout via start.sh instead
# log_file_latest = true
# use_syslog = true

log_files_max_size = 10
log_files_max_age = 7
log_files_max_backups = 1


###############################################################################
#                           Certificate Management                            #
###############################################################################

## Concurrency for refreshing resolver certificates. Reduced from the default (10)
## for the constrained CPU budget.
cert_refresh_concurrency = 2
cert_refresh_delay = 360

# cert_ignore_timestamp = false
# dnscrypt_ephemeral_keys = false
# pqdnscrypt = true          # post-quantum DNSCrypt; enabled by default upstream, N/A (DoH-only)
# tls_disable_session_tickets = false
# tls_prefer_rsa = false
# tls_key_log_file = '/tmp/keylog.txt'   # NEVER enable outside local debugging


###############################################################################
#                            Startup & Network                                #
###############################################################################

## One-shot resolvers used only for initial hostname/certificate bootstrap of the
## static DoH stamps below. User queries are never sent here.
bootstrap_resolvers = ['9.9.9.11:53', '8.8.8.8:53']

ignore_system_dns = true
netprobe_timeout = 0
netprobe_address = '9.9.9.9:53'

# offline_mode = false
# query_meta = ['key1:value1']


###############################################################################
#                                 Filters                                     #
###############################################################################

block_ipv6 = false
block_unqualified = true
block_undelegated = true
reject_ttl = 10


###############################################################################
#                              Forwarding                                     #
###############################################################################

# forwarding_rules = 'forwarding-rules.txt'   # not used in this deployment


###############################################################################
#                                Cloaking                                     #
###############################################################################

# cloaking_rules = 'cloaking-rules.txt'
# cloak_ttl = 600
# cloak_ptr = false


###############################################################################
#                                DNS Cache                                    #
###############################################################################

cache = true
cache_size = 1024
cache_min_ttl = 300
cache_max_ttl = 86400
cache_neg_min_ttl = 60
cache_neg_max_ttl = 600


###############################################################################
#                           Captive portal handling                           #
###############################################################################

[captive_portals]
# map_file = 'example-captive-portals.txt'


###############################################################################
#                            Local DoH server                                 #
###############################################################################

[local_doh]
## MUST stay disabled here: the doh-gateway Go binary is the DoH endpoint for
## this deployment. Enabling this would try to bind the same service port.
# listen_addresses = ['127.0.0.1:3000']
# path = '/dns-query'
# cert_file = 'localhost.pem'
# cert_key_file = 'localhost.pem'


###############################################################################
#                              Query logging                                  #
###############################################################################

[query_log]
# file = 'query.log'   # unset: no query log file is written
format = 'tsv'
# ignored_qtypes = ['DNSKEY', 'NS']


###############################################################################
#                        Suspicious queries logging                           #
###############################################################################

[nx_log]
# file = 'nx.log'      # unset: no NXDOMAIN log file is written
format = 'tsv'


###############################################################################
#                    Pattern-based blocking / allow lists                     #
###############################################################################
## Blocklists/allowlists are opt-in via *_file below. See the wiki for pattern
## syntax and example blocklist sources.

[blocked_names]
# blocked_names_file = 'blocked-names.txt'
# log_file = 'blocked-names.log'
# log_format = 'tsv'

[blocked_ips]
# blocked_ips_file = 'blocked-ips.txt'
# log_file = 'blocked-ips.log'
# log_format = 'tsv'

[allowed_names]
# allowed_names_file = 'allowed-names.txt'
# log_file = 'allowed-names.log'
# log_format = 'tsv'

[allowed_ips]
# allowed_ips_file = 'allowed-ips.txt'
# log_file = 'allowed-ips.log'
# log_format = 'tsv'


###############################################################################
#                        Time access restrictions                             #
###############################################################################

[schedules]
# [schedules.time-to-sleep]
#   mon = [{after='21:00', before='7:00'}]


###############################################################################
#                                Servers                                      #
###############################################################################

[sources]
## Intentionally empty: remote resolver sources are disabled. This deployment
## is self-contained and uses only the three static HaGeZi resolvers in
## [static.*] below — nothing is downloaded or dynamically selected.


###############################################################################
#                        Servers with known bugs                              #
###############################################################################

## Workarounds for resolvers that mishandle large/fragmented queries.
[broken_implementations]
fragments_blocked = [
  'cisco',
  'cisco-ipv6',
  'cisco-familyshield',
  'cisco-familyshield-ipv6',
  'cisco-sandbox',
  'cleanbrowsing-adult',
  'cleanbrowsing-adult-ipv6',
  'cleanbrowsing-family',
  'cleanbrowsing-family-ipv6',
  'cleanbrowsing-security',
  'cleanbrowsing-security-ipv6',
]


###############################################################################
#                Certificate-based client authentication for DoH              #
###############################################################################

[doh_client_x509_auth]
# creds = [
#    { server_name='*', client_cert='client.crt', client_key='client.key' }
# ]


###############################################################################
#                          Anonymized DNS                                     #
###############################################################################

[anonymized_dns]
# routes = [
#    { server_name='example-server-1', via=['anon-example-1', 'anon-example-2'] }
# ]
skip_incompatible = false
# direct_cert_fallback = true


###############################################################################
#                                 DNS64                                       #
###############################################################################

[dns64]
# prefix = ['64:ff9b::/96']
# resolver = ['[2606:4700:4700::64]:53', '[2001:4860:4860::64]:53']


###############################################################################
#                           IP Encryption                                     #
###############################################################################

[ip_encryption]
## IPCrypt encryption for client IPs in plugin logs. "none" since no query/nx
## log file is enabled above.
algorithm = "none"
key = ""


###############################################################################
#                            Monitoring UI                                    #
###############################################################################

[monitoring_ui]
enabled = false

## NOTE: kept off 127.0.0.1:8080 deliberately — the doh-gateway binary already
## binds 0.0.0.0:$PORT (8080 by default), and 0.0.0.0 covers the loopback
## interface too, so the two would collide if this were ever enabled without
## also changing the port here.
listen_address = "127.0.0.1:8081"

## Change these before ever enabling the UI.
username = "admin"
password = "changeme"

tls_certificate = ""
tls_key = ""

enable_query_log = true
privacy_level = 1   # 0=full detail, 1=anonymize client IPs, 2=aggregate only

# max_query_log_entries = 100
# max_memory_mb = 1
# prometheus_enabled = false
# prometheus_path = "/metrics"


###############################################################################
#                            Static entries                                   #
###############################################################################
