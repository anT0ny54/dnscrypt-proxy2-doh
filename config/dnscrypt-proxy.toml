###############################################################################
# dnscrypt-proxy — SnapDeploy, 512 MB RAM / 0.25 vCPU
#
# Deliberately minimal: only settings used by this deployment are kept.
# Upstream documentation: https://github.com/DNSCrypt/dnscrypt-proxy/wiki
#
# The three HaGeZi DNS-over-HTTPS stamps below contain their resolver IPs.
# No public resolver source or plaintext bootstrap DNS is required, which keeps
# runtime behavior self-contained and avoids a separate port-53 bootstrap path.
###############################################################################

server_names = ['HaGeZiDNS1', 'HaGeZiDNS2', 'HaGeZiDNS3']

# Rewritten at container startup from $DNS_LISTEN.
listen_addresses = ['127.0.0.1:5300']

# Small but sufficient backpressure for a 0.25 vCPU instance.
max_clients = 32

###############################################################################
# Upstream selection
###############################################################################

ipv4_servers = true
ipv6_servers = false
dnscrypt_servers = false
doh_servers = true
odoh_servers = false

# Static HaGeZi stamps are the source of truth, so remote-source filters are
# unnecessary here.

###############################################################################
# Transport
###############################################################################

force_tcp = false
http3 = false
http3_probe = false
timeout = 5000
keepalive = 10

###############################################################################
# Load balancing
###############################################################################

# 'wp2' picks the better of two random candidates by real-time RTT *and*
# success rate, so a degrading resolver is routed around automatically. With
# only three static resolvers, that matters more than the raw CPU cost of the
# comparison, which is negligible either way (a handful of arithmetic
# operations per query, not per HTTP request).
lb_strategy = 'p2'
lb_estimator = true

###############################################################################
# Resolver certificate refresh
###############################################################################

# Three static DoH resolvers; two concurrent refreshes are enough for this CPU.
cert_refresh_concurrency = 2
cert_refresh_delay = 240

###############################################################################
# Startup / network behavior
###############################################################################

# User queries never use plaintext DNS. The static HaGeZi stamps already carry
# resolver IPs, so no bootstrap resolver is configured.
ignore_system_dns = true
# Skips the startup connectivity probe entirely. dnscrypt-proxy 2.1.17 fixed
# this setting being silently overridden by its command-line default, so the
# pinned 2.1.18 build is required for a value of 0 to actually take effect.
netprobe_timeout = 0

###############################################################################
# Local filtering / safety behavior
###############################################################################

block_ipv6 = false
block_unqualified = true
block_undelegated = true
reject_ttl = 10

###############################################################################
# DNS cache
###############################################################################

cache = true
cache_size = 1024
cache_min_ttl = 300
cache_max_ttl = 86400
cache_neg_min_ttl = 60
cache_neg_max_ttl = 600

###############################################################################
# Public resolver stamps
###############################################################################

# Current HaGeZi full-protection DoH endpoints.
[static.HaGeZiDNS1]
stamp = 'sdns://AgMAAAAAAAAADjE4OC4zNC4xNjEuMjEwAA9yb290LmhhZ2V6aS5vcmcKL2Rucy1xdWVyeQ'

[static.HaGeZiDNS2]
stamp = 'sdns://AgMAAAAAAAAADTE1OS42OS4xNTUuOTQAEHd1cnpuLmhhZ2V6aS5vcmcKL2Rucy1xdWVyeQ'

[static.HaGeZiDNS3]
stamp = 'sdns://AgMAAAAAAAAADTk1LjIxNy4xNjMuMTcAEGp1dXJpLmhhZ2V6aS5vcmcKL2Rucy1xdWVyeQ'
