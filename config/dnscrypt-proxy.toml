###############################################################################
# dnscrypt-proxy — SnapDeploy: 512 MB RAM / 0.25 vCPU
#
# Minimal static-resolver configuration for a public DoH gateway.
#
# Upstream documentation:
#   https://github.com/DNSCrypt/dnscrypt-proxy/wiki
# Public resolver list:
#   https://github.com/DNSCrypt/dnscrypt-resolvers/tree/master/v3
# HaGeZi DNS servers:
#   https://github.com/hagezi/dns-servers
###############################################################################

# Fixed resolver set: these stamps include the resolver IPs and DoH hostnames.
# No runtime resolver-name override or remote source is used.
server_names = ['HaGeZiDNS1', 'HaGeZiDNS2', 'HaGeZiDNS3']

# Only the local DoH gateway can reach the resolver.
listen_addresses = ['127.0.0.1:5300']

# Fixed local concurrency ceiling for the resolver. The gateway's
# DOH_MAX_INFLIGHT is hard-capped at the same 64, so the public layer cannot
# admit more concurrent DNS work than the resolver is configured to handle.
max_clients = 64

###############################################################################
# Upstream selection
###############################################################################

ipv4_servers = true
ipv6_servers = false
dnscrypt_servers = false
doh_servers = true
odoh_servers = false

###############################################################################
# DoH transport
###############################################################################

# All configured upstreams are DoH over HTTPS. HTTP/3 is disabled to avoid
# extra UDP socket/probing work on the small CPU budget.
http3 = false
http3_probe = false

# Upstream timeout in milliseconds. The DoH gateway enforces its own shared
# SERVER_TIMEOUT deadline of 6 seconds for the complete local DNS exchange.
# Keeping the resolver-side timeout below that deadline lets dnscrypt-proxy
# return SERVFAIL during an upstream outage before the gateway has to return
# HTTP 502 for a timed-out local exchange.
timeout = 5000

# Three long-lived upstream connections have negligible memory cost here and
# avoid repeated TLS setup on a small CPU budget. Idle connections are kept
# for 2 minutes so quiet gaps between bursts do not force a new handshake.
keepalive = 120

###############################################################################
# Load balancing
###############################################################################

lb_strategy = 'p2'
lb_estimator = true
# Preserve responsiveness as max_clients is approached.
timeout_load_reduction = 0.75

###############################################################################
# Resolver certificate refresh
###############################################################################

cert_refresh_concurrency = 2
cert_refresh_delay = 240

###############################################################################
# Startup / network behavior
###############################################################################

# No plaintext bootstrap DNS is needed: every checked-in DoH stamp contains its
# resolver IP. Do not fall back to the container/host resolver.
ignore_system_dns = true

# Wait briefly for container networking before initializing upstreams. This is
# only a connectivity probe; it does not send a plaintext DNS query. Keeping
# the timeout finite avoids a startup race without adding a long boot delay.
netprobe_timeout = 15
netprobe_address = '1.1.1.1:443'

###############################################################################
# Local filtering / safety behavior
###############################################################################

# Do not synthesize AAAA filtering responses globally; IPv6 DNS queries remain
# supported when clients request them.
block_ipv6 = false

# Reject dotless/local-looking names instead of sending them to public DNS.
block_unqualified = true
block_undelegated = true
reject_ttl = 10

###############################################################################
# DNS cache
###############################################################################

cache = true
# 8192 entries keeps cache memory bounded on a 512 MiB instance while still
# absorbing repeated lookups across many clients.
cache_size = 8192
cache_min_ttl = 60
cache_max_ttl = 86400
cache_neg_min_ttl = 60
cache_neg_max_ttl = 600

###############################################################################
# Static HaGeZi full-protection DoH resolvers
###############################################################################

# Current HaGeZi stamps for root.hagezi.org, wurzn.hagezi.org and
# juuri.hagezi.org — see the upstream table linked above for the authoritative list.
[static.HaGeZiDNS1]
stamp = 'sdns://AgMAAAAAAAAADjE4OC4zNC4xNjEuMjEwAA9yb290LmhhZ2V6aS5vcmcKL2Rucy1xdWVyeQ'

[static.HaGeZiDNS2]
stamp = 'sdns://AgMAAAAAAAAADTE1OS42OS4xNTUuOTQAEHd1cnpuLmhhZ2V6aS5vcmcKL2Rucy1xdWVyeQ'

[static.HaGeZiDNS3]
stamp = 'sdns://AgMAAAAAAAAADTk1LjIxNy4xNjMuMTcAEGp1dXJpLmhhZ2V6aS5vcmcKL2Rucy1xdWVyeQ'
