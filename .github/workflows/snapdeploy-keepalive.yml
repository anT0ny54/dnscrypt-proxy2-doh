name: SnapDeploy check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check SnapDeploy
        env:
          URL: ${{ secrets.KEEPALIVE_URL }}
        run: |
          set -euo pipefail

          test -n "$URL"

          HTTP_CODE=$(curl \
            --location \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --connect-timeout 10 \
            --max-time 30 \
            -A "Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 Chrome/137.0 Mobile Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            "$URL")

          echo "HTTP $HTTP_CODE"

          case "$HTTP_CODE" in
            2??|3??)
              echo "Request succeeded."
              ;;
            *)
              echo "Request failed."
              exit 1
              ;;
          esac
