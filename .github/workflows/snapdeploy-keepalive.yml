name: SnapDeploy health check

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check SnapDeploy application
        env:
          APP_URL: ${{ secrets.KEEPALIVE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${APP_URL:-}" ]]; then
            echo "::error::KEEPALIVE_URL secret is empty or missing"
            exit 1
          fi

          echo "Checking: $APP_URL"

          response="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 2 \
              --retry-delay 3 \
              --write-out $'\n%{http_code}' \
              "$APP_URL"
          )"

          http_code="${response##*$'\n'}"
          body="${response%$'\n'*}"

          echo "HTTP status: $http_code"

          if [[ "$http_code" != "2"* ]]; then
            echo "::error::Application returned HTTP $http_code"
            exit 1
          fi

          echo "SnapDeploy application is responding normally."
