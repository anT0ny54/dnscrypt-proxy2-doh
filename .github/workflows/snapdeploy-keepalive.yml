name: SnapDeploy keepalive

on:
  schedule:
    # Run every 10 minutes.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Wake / keep container active
        env:
          KEEPALIVE_URL: ${{ secrets.KEEPALIVE_URL }}
        run: |
          set -eu

          if [ -z "${KEEPALIVE_URL:-}" ]; then
            echo "ERROR: KEEPALIVE_URL secret is empty or not configured."
            exit 1
          fi

          echo "Pinging SnapDeploy..."

          response="$(
            curl \
              --location \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout 10 \
              --max-time 60 \
              --user-agent "Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 Chrome/137.0 Mobile Safari/537.36" \
              --header "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              "$KEEPALIVE_URL" \
              || true
          )"

          echo "HTTP response: $response"

          case "$response" in
            2??|3??|4??|5??)
              echo "SnapDeploy endpoint was reached."
              exit 0
              ;;
            *)
              echo "ERROR: No valid HTTP response received."
              exit 1
              ;;
          esac
