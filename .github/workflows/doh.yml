- name: Send DoH request
  run: |
    python - <<'PY'
    import dns.message
    import requests

    url = "https://dns-93aca.containers.snapdeploy.app/dns-query"

    query = dns.message.make_query("github.com", "A")

    r = requests.post(
        url,
        data=query.to_wire(),
        headers={
            "Content-Type": "application/dns-message",
            "Accept": "application/dns-message",
        },
        timeout=10,
    )

    print("HTTP:", r.status_code)
    print("Content-Type:", r.headers.get("content-type"))
    print("Body:", r.text[:500] if r.status_code != 200 else "")

    r.raise_for_status()

    response = dns.message.from_wire(r.content)
    print(response)
    PY
