name: Test DoH Gateway

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check dnspython requests

      - name: Test health endpoint
        run: |
          echo "=== /healthz ==="
          curl -i -sS \
            --max-time 20 \
            "https://dns-93aca.containers.snapdeploy.app/healthz" \
            || true

      - name: Test DoH endpoint
        run: |
          python - <<'PY'
          import dns.message
          import requests

          url = "https://dns-93aca.containers.snapdeploy.app/dns-query"

          query = dns.message.make_query("github.com", "A")

          response = requests.post(
              url,
              data=query.to_wire(),
              headers={
                  "Content-Type": "application/dns-message",
                  "Accept": "application/dns-message",
              },
              timeout=20,
          )

          print("HTTP status:", response.status_code)
          print("Response headers:")

          for name, value in response.headers.items():
              print(f"  {name}: {value}")

          if response.status_code == 200:
              answer = dns.message.from_wire(response.content)
              print("\nDNS response:")
              print(answer)
          else:
              print("\nResponse body:")
              print(response.text[:1000])
          PY
