name: Standard DoH request

on:
  schedule:
    - cron: "*/11 * * * *"
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: python -m pip install dnspython requests

      - name: Send DNS-over-HTTPS request
        run: |
          python - <<'PY'
          import dns.message
          import requests

          doh_url = "https://dns-93aca.containers.snapdeploy.app/dns-query"

          query = dns.message.make_query("github.com", "A")
          wire = query.to_wire()

          response = requests.post(
              doh_url,
              data=wire,
              headers={
                  "Content-Type": "application/dns-message",
                  "Accept": "application/dns-message",
              },
              timeout=10,
          )

          response.raise_for_status()

          dns_response = dns.message.from_wire(response.content)

          print(dns_response)
          PY
